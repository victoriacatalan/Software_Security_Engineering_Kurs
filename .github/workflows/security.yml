name: Security Scanning

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - main

# As always, follow the principle of least privilege:     
permissions:
  # Read only access to repository content such as commits, branches, releases and so on.
  contents: read
  # Permissions for GitHub Actions to upload SARIF results:
  security-events: write

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: returntocorp/semgrep
    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')
    permissions:
      # required for all workflows
      security-events: write
      # only required for workflows in private repositories
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep scan on todo-app
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif .
        working-directory: todo-app
        continue-on-error: true
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: todo-app/semgrep.sarif


  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner on todo-app
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: repo
          scan-ref: todo-app
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
        env:
          TRIVY_SKIP_DB_UPDATE: false
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  truffle:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - run: echo "Implement trufflehog scan"
